<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#fff}
svg{display:block;font-family:"Times New Roman",Times,serif}
.t{font-size:22px;fill:#1d1d1d}.s{font-size:19px;fill:#1d1d1d}.i{font-style:italic}
.box{stroke:#222;stroke-width:2.5;rx:16}
</style></head><body>
<svg width="1050" height="765" viewBox="0 0 1050 765" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
  <!-- zones -->
  <text x="152" y="26" text-anchor="middle" class="t i" style="font-size:25px">Public zone</text>
  <text x="710" y="26" text-anchor="middle" class="t i" style="font-size:25px">Trusted zone (server side)</text>
  <rect x="8" y="42" width="290" height="700" rx="20" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="11 8"/>
  <rect x="378" y="42" width="664" height="700" rx="20" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="11 8"/>

  <!-- client -->
  <rect class="box" x="30" y="70" width="246" height="470" fill="#e8eef9"/>
  <text x="153" y="108" text-anchor="middle" class="t" style="font-size:24px">Browser client</text>
  <text x="153" y="136" text-anchor="middle" class="s">React + Tailwind CSS</text>
  <g class="s" text-anchor="middle">
    <text x="153" y="186">Awareness</text><text x="153" y="214">Self-help tools</text><text x="153" y="242">Mood &amp; journal</text>
    <text x="153" y="270">Counselling request</text><text x="153" y="298">Emergency page + help button</text>
    <text x="153" y="326">Recommender input</text><text x="153" y="354">Privacy &amp; data (export, erase)</text>
  </g>
  <line x1="46" y1="384" x2="260" y2="384" stroke="#8a97b3" stroke-width="1.5"/>
  <text x="153" y="416" text-anchor="middle" class="s">Access token kept</text>
  <text x="153" y="442" text-anchor="middle" class="s">in memory only</text>
  <text x="153" y="476" text-anchor="middle" class="s">httpOnly refresh cookie</text>
  <text x="153" y="502" text-anchor="middle" class="s">(not readable by scripts)</text>
  <rect class="box" x="30" y="600" width="246" height="112" fill="#fff"/>
  <text x="153" y="648" text-anchor="middle" class="t">Student /</text>
  <text x="153" y="676" text-anchor="middle" class="t">counsellor</text>
  <line x1="153" y1="600" x2="153" y2="542" stroke="#222" stroke-width="3" marker-end="url(#a)"/>

  <!-- API -->
  <rect class="box" x="418" y="70" width="300" height="470" fill="#e9f1e6"/>
  <text x="568" y="106" text-anchor="middle" class="t" style="font-size:24px">API server</text>
  <text x="568" y="134" text-anchor="middle" class="s">Node.js + Express</text>
  <g class="s" text-anchor="middle">
    <text x="568" y="180">Rate limiting + lockout</text>
    <text x="568" y="208">Validation + sanitisation</text>
    <text x="568" y="236">JWT 15 min + rotating</text><text x="568" y="260">refresh token, CSRF token</text>
    <text x="568" y="288">Role-based access +</text><text x="568" y="312">object ownership checks</text>
    <text x="568" y="340">Consent check</text>
    <text x="568" y="368">Crisis lexicon (fail-safe)</text>
    <text x="568" y="396">Field-level AES-256-GCM</text>
    <text x="568" y="424">Audit logging</text>
    <text x="568" y="466">TLS 1.2+ at reverse proxy</text><text x="568" y="490">(deployment setting)</text>
  </g>

  <!-- client <-> API -->
  <line x1="276" y1="270" x2="418" y2="270" stroke="#222" stroke-width="3" marker-end="url(#a)"/>
  <line x1="418" y1="352" x2="276" y2="352" stroke="#222" stroke-width="3" marker-end="url(#a)"/>
  <text x="347" y="250" text-anchor="middle" class="s i">HTTPS</text>
  <text x="347" y="376" text-anchor="middle" class="s i">JSON</text>

  <!-- NLP -->
  <rect class="box" x="772" y="70" width="252" height="300" fill="#fbf0dc"/>
  <text x="898" y="106" text-anchor="middle" class="t" style="font-size:24px">NLP service</text>
  <text x="898" y="134" text-anchor="middle" class="s">Python + FastAPI</text>
  <g class="s" text-anchor="middle">
    <text x="898" y="180">Crisis gate: lexicon +</text><text x="898" y="204">learned classifier</text>
    <text x="898" y="238">Hybrid retrieval:</text><text x="898" y="262">TF-IDF + SBERT</text>
    <text x="898" y="296">Low-confidence fallback</text>
    <text x="898" y="330">Queries never stored</text>
  </g>
  <line x1="718" y1="150" x2="772" y2="150" stroke="#222" stroke-width="3" marker-end="url(#a)"/>
  <line x1="772" y1="236" x2="718" y2="236" stroke="#222" stroke-width="3" marker-end="url(#a)"/>
  <text x="745" y="136" text-anchor="middle" class="s i">query</text>
  <text x="745" y="262" text-anchor="middle" class="s i">status,</text>
  <text x="745" y="284" text-anchor="middle" class="s i">ranked</text>

  <!-- DB -->
  <rect class="box" x="772" y="428" width="252" height="284" fill="#ece4f3"/>
  <text x="898" y="466" text-anchor="middle" class="t" style="font-size:24px">MongoDB</text>
  <g class="s" text-anchor="middle">
    <text x="898" y="508">Users (bcrypt cost 12)</text>
    <text x="898" y="540">Journals + counselling</text><text x="898" y="564">requests (encrypted)</text>
    <text x="898" y="598">Hashed refresh tokens</text>
    <text x="898" y="632">Audit log</text>
    <text x="898" y="666">Database encryption</text><text x="898" y="690">at rest (hosting)</text>
  </g>
  <line x1="718" y1="470" x2="772" y2="520" stroke="#222" stroke-width="3" marker-end="url(#a)"/>

  <!-- corpus -->
  <rect class="box" x="418" y="600" width="300" height="112" fill="#fff"/>
  <text x="568" y="648" text-anchor="middle" class="t">Curated resource corpus</text>
  <text x="568" y="676" text-anchor="middle" class="t">+ helplines</text>
  <line x1="568" y1="540" x2="568" y2="600" stroke="#222" stroke-width="3" marker-end="url(#a)"/>
</svg></body></html>
